[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The admin portal is a private tool: keep it out of search engines and frames.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Google Sign-In returns the token from a popup via postMessage; a stricter
    # COOP ("same-origin") breaks that silently. Google documents this value.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
